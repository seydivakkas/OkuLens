<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OkuLens Ayarlar</title><style>
body{font:15px system-ui,sans-serif;max-width:660px;margin:45px auto;padding:20px;color:#26364a;background:#f6f8fc}main{background:#fff;border:1px solid #dce4ed;border-radius:16px;padding:28px}h1{font-size:25px}label{display:block;margin:24px 0 8px;font-weight:700}select,button{font:inherit;border:1px solid #b9cadd;padding:10px 14px;border-radius:8px}button{background:#194579;color:white;cursor:pointer;margin-top:22px}small{color:#65758d;line-height:1.5}#status{margin-top:20px}
</style></head><body><main><h1>OkuLens · Ayarlar</h1><p>Bu tercihler yalnızca bu tarayıcı profilinde saklanır. Üretken Türkçe modeli henüz bu sürümde bulunmuyor.</p><label for="length">Varsayılan kelime hedefi</label><select id="length"><option value="10">10 kelime</option><option value="100">100 kelime</option><option value="1000">1000 kelime</option></select><label for="difficulty">Varsayılan anlatım seviyesi</label><select id="difficulty"><option value="easy">Kolay</option><option value="medium">Orta</option><option value="hard">Zor / akademik</option></select><p><small>Not: P0 sürümündeki çıkarımsal motor anlatım düzeyini yeniden yazmaz; seçenek gelecekteki üretken motorlar içindir.</small></p><button id="save">Tercihleri kaydet</button><div id="status" role="status"></div></main><script type="module" src="options.js"></script></body></html>
